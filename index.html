<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brain Bites — think of the answer nobody else thought of</title>
<meta name="description" content="A trivia game where the rarest correct answer wins. Thirteen topics, nine questions a run. Common answers barely score.">
<meta name="theme-color" content="#0F3B33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:      #0F3B33;   /* emerald base */
    --ink-2:    #4A1F2E;   /* burgundy bloom */
    --paper:    #FBF6EC;   /* warm pastel cream */
    --dim:      #A9C6BB;
    --mint:     #BFE9D4;   /* pastel mint */
    --amber:    #FBE7B2;   /* pastel butter */
    --peach:    #FBD9BE;   /* pastel peach */
    --coral:    #F7C2C2;   /* pastel blush */
    --violet:   #DCCDF2;   /* pastel lilac */
    --sky:      #CFE4F2;   /* pastel sky */
    --line:     rgba(251,246,236,.18);
    --display:  "Tinos", "Times New Roman", Times, serif;
    --body:     "Tinos", "Times New Roman", Times, serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; min-height: 100%; background: var(--ink); color: var(--paper);
    font-family: var(--body); font-size: 18px; line-height: 1.5;
    overflow-x: hidden;
  }
  /* A slow emerald-to-burgundy wash, with pastel shapes drifting up through
     it. One motion idea, running behind everything. */
  body::before {
    content: ""; position: fixed; inset: -20%; z-index: -3; pointer-events: none;
    background:
      radial-gradient(44vmax 44vmax at 14% 8%, rgba(74,31,46,.85), transparent 60%),
      radial-gradient(40vmax 40vmax at 88% 84%, rgba(74,31,46,.6), transparent 60%),
      radial-gradient(50vmax 50vmax at 52% 42%, rgba(23,84,72,.7), transparent 70%);
    animation: wash 40s ease-in-out infinite alternate;
  }
  @keyframes wash { from { transform: translate3d(-2%,-2%,0) scale(1); } to { transform: translate3d(3%,2%,0) scale(1.1); } }

  .sky { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
  .sky i {
    position: absolute; bottom: -22vmin; display: block;
    width: var(--s); height: var(--s); opacity: .22;
    background: var(--c); border-radius: var(--r, 50%);
    animation: rise var(--d) linear var(--delay) infinite;
  }
  @keyframes rise {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
    12%  { opacity: .24; }
    88%  { opacity: .18; }
    100% { transform: translate3d(var(--x), -128vh, 0) rotate(var(--spin)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none; }
    .sky i { animation: none; opacity: .14; bottom: auto; top: var(--rest, 40%); }
  }

  #app { max-width: 640px; margin: 0 auto; padding: 22px 20px 60px; }
  h1, h2, .display { font-family: var(--display); font-style: italic; font-weight: 700; letter-spacing: -.01em; line-height: 1.08; margin: 0 0 .35em; }
  h2 { font-size: 1.2rem; letter-spacing: 0; margin: 2em 0 .7em; color: var(--dim); }
  p { margin: 0 0 .9em; max-width: 34em; }
  .muted { color: var(--dim); font-size: .95rem; }
  .warn { color: var(--peach); font-size: .95rem; }

  .hero { padding: 18px 0 6px; }
  .brand { font-size: clamp(3.4rem, 16vw, 5.6rem); }
  .brand span { display: block; color: var(--mint); margin-left: .06em; }
  .hook { font-family: var(--body); font-style: italic; font-size: 1.35rem; color: var(--peach); margin: .2em 0 .6em; }
  .lede { color: var(--dim); }

  .btn { font-family: var(--display); font-weight: 700; font-size: 1rem; letter-spacing: 0;
    border: 1.5px solid var(--line); background: rgba(251,246,236,.07); color: var(--paper);
    border-radius: 999px; padding: .62em 1.3em; cursor: pointer; transition: background .15s, border-color .15s; }
  .btn:hover { background: rgba(251,246,236,.15); border-color: var(--dim); }
  .btn.primary { background: var(--mint); border-color: var(--mint); color: #0F3B33; }
  .btn.primary:hover { background: #D6F3E4; }
  .btn.link { border: 0; background: none; color: var(--dim); padding: .3em 0; text-decoration: underline; text-underline-offset: 4px; font-weight: 500; }
  .btn.link:hover { color: var(--paper); background: none; }
  :focus-visible { outline: 3px solid var(--peach); outline-offset: 3px; border-radius: 6px; }

  .daily { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 16px; width: 100%; text-align: left;
    background: linear-gradient(135deg, rgba(220,205,242,.20), rgba(191,233,212,.14));
    border: 1.5px solid rgba(220,205,242,.5); border-radius: 20px; padding: 18px 20px; margin: 1.4em 0 0;
    color: var(--paper); font: inherit; cursor: pointer; transition: transform .15s, border-color .15s; }
  .daily:hover { transform: translateY(-2px); border-color: var(--violet); }
  .daily-tag { grid-column: 1; font-family: var(--display); font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--violet); }
  .daily-title { grid-column: 1; font-family: var(--display); font-style: italic; font-size: 1.75rem; font-weight: 700; }
  .daily-meta { grid-column: 1; color: var(--dim); font-size: .92rem; }
  .daily-go { grid-column: 2; grid-row: 1 / 3; font-size: 1.6rem; color: var(--mint); align-self: center; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; text-align: left; min-height: 104px; justify-content: center;
    background: rgba(251,246,236,.07); border: 1px solid var(--line); border-radius: 16px; padding: 14px;
    color: var(--paper); font: inherit; cursor: pointer; transition: transform .14s, background .14s, border-color .14s; }
  .tile:hover { transform: translateY(-3px); background: rgba(251,246,236,.14); border-color: var(--mint); }
  .tile-emoji { font-size: 1.6rem; line-height: 1.2; }
  .tile-label { font-family: var(--display); font-style: italic; font-weight: 700; font-size: 1.12rem; }
  .tile-meta { color: var(--dim); font-size: .82rem; }

  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-top: 2.2em; color: var(--dim); font-size: .95rem; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--mint); }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 1.5em; }
  .dots { display: flex; gap: 6px; }
  .dots .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(251,246,236,.22); transition: background .2s, transform .2s; }
  .dots .dot.done { background: var(--mint); }
  .dots .dot.now { background: var(--peach); transform: scale(1.5); }
  .ring { position: relative; display: grid; place-items: center; width: 44px; height: 44px; flex: none;
    font-family: var(--display); font-weight: 800; font-size: .95rem; color: var(--paper); font-variant-numeric: tabular-nums; }
  .ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--mint) calc(var(--frac, 1) * 360deg), rgba(251,246,236,.16) 0);
    -webkit-mask: radial-gradient(circle, transparent 15px, #000 16px);
    mask: radial-gradient(circle, transparent 15px, #000 16px); transition: background .4s linear; }
  .ring.low::before { background: conic-gradient(var(--coral) calc(var(--frac,1) * 360deg), rgba(251,246,236,.16) 0); }
  .ring.low { color: var(--coral); }

  .qcard { border-left: 3px solid var(--peach); padding-left: 16px; margin-bottom: 1.4em; }
  .qtopic { font-family: var(--display); font-size: .84rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .qtext { font-size: clamp(1.75rem, 6.4vw, 2.5rem); margin: .18em 0 .25em; }
  .qhint { color: var(--dim); font-style: italic; font-size: .98rem; margin: 0; }

  .answer-form { display: flex; gap: 8px; }
  .answer-form input { flex: 1; min-width: 0; font-family: var(--body); font-size: 1.15rem; color: var(--paper);
    background: rgba(15,59,51,.5); border: 1.5px solid var(--line); border-radius: 14px; padding: .65em .9em; }
  .answer-form input:focus { border-color: var(--mint); }
  .answer-form input::placeholder { color: var(--dim); }
  .note { min-height: 1.6em; color: var(--peach); font-size: .95rem; margin: .7em 0 .2em; }

  .slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .slot { display: grid; grid-template-columns: 2rem 1fr auto; align-items: center; gap: 12px;
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: rgba(251,246,236,.06); }
  .slot.empty { border-style: dashed; color: var(--dim); }
  .slot .slot-n { font-size: 1.2rem; text-align: center; }
  .slot.empty .slot-n { font-family: var(--display); font-size: .72rem; }
  .slot-body { display: flex; flex-direction: column; min-width: 0; }
  .slot-body b { font-family: var(--display); font-weight: 700; font-size: 1.08rem; }
  .slot-body small { color: var(--dim); font-size: .84rem; }
  .slot-pts { font-family: var(--display); font-weight: 800; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .slot.common   { border-color: rgba(207,228,242,.45); } .slot.common .slot-pts { color: var(--sky); }
  .slot.familiar { border-color: rgba(251,231,178,.5); }  .slot.familiar .slot-pts { color: var(--amber); }
  .slot.uncommon { border-color: rgba(251,217,190,.55); } .slot.uncommon .slot-pts { color: var(--peach); }
  .slot.rare     { border-color: rgba(247,194,194,.6); }  .slot.rare .slot-pts { color: var(--coral); }
  .slot.offmenu  { border-color: var(--violet); background: rgba(220,205,242,.16); box-shadow: 0 0 26px rgba(220,205,242,.3); }
  .slot.offmenu .slot-pts { color: var(--violet); }
  .slot.pending { border-style: dashed; border-color: var(--violet); }
  .slot:not(.empty) { animation: land .3s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes land { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .slot:not(.empty) { animation: none; } .daily:hover, .tile:hover { transform: none; } }
  .slots.mini .slot { padding: 9px 12px; }
  .runscore { color: var(--dim); font-size: .92rem; margin-top: 1em; }
  .runscore b { font-family: var(--display); color: var(--paper); }

  .unlimited { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 16px; width: 100%; text-align: left;
    background: linear-gradient(135deg, rgba(251,217,190,.20), rgba(247,194,194,.14));
    border: 1.5px solid rgba(251,217,190,.5); border-radius: 20px; padding: 18px 20px; margin: 10px 0 0;
    color: var(--paper); font: inherit; cursor: pointer; transition: transform .15s, border-color .15s; }
  .unlimited:hover { transform: translateY(-2px); border-color: var(--peach); }
  .unlimited .daily-tag { color: var(--peach); }
  .unlimited .daily-go { color: var(--peach); }

  .card { border: 1.5px solid var(--line); border-radius: 22px; padding: 22px 22px 18px; margin: .6em 0 1.4em;
    background: linear-gradient(150deg, rgba(251,246,236,.12), rgba(251,246,236,.04)); }
  .card-tag { font-family: var(--display); font-size: .8rem; font-weight: 700; color: var(--dim); margin: 0 0 .2em; letter-spacing: .1em; text-transform: uppercase; }
  .card-rank { font-size: clamp(2rem, 8.5vw, 3.1rem); margin: 0 0 .18em; color: var(--paper); }
  .card-line { font-style: italic; color: var(--mint); margin: 0 0 1em; }
  .meter { height: 12px; border-radius: 999px; background: rgba(15,59,51,.5); overflow: hidden; border: 1px solid var(--line); }
  .meter-fill { display: block; height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--sky), var(--mint), var(--amber), var(--peach), var(--coral), var(--violet));
    animation: fill .9s cubic-bezier(.2,.8,.3,1); transform-origin: left; }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .meter-fill { animation: none; } }
  .card-nums { margin: .7em 0 0; color: var(--dim); font-size: .95rem; }
  .card-nums b { font-family: var(--display); color: var(--paper); }

  .bigscore { font-size: clamp(3rem, 14vw, 4.6rem); color: var(--mint); }
  .bigscore small { font-size: .22em; color: var(--dim); font-weight: 500; }
  .strip { font-size: 1.5rem; letter-spacing: .12em; margin: -.2em 0 .8em; }
  .callout { border-left: 3px solid var(--violet); padding-left: 14px; font-style: italic; }
  .breakdown { margin: 1.4em 0; display: grid; gap: 8px; }
  details { border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; background: rgba(251,246,236,.06); }
  details[open] { border-color: var(--dim); }
  summary { cursor: pointer; display: flex; justify-content: space-between; gap: 14px; align-items: baseline; }
  summary span { font-size: .98rem; }
  summary b { font-family: var(--display); white-space: nowrap; }
  details .slots { margin-top: 10px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 1.3em 0 .4em; }
  .prose h1 { margin-top: .5em; font-size: clamp(2rem, 8vw, 2.8rem); }
  textarea { width: 100%; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--paper);
    background: rgba(15,59,51,.55); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
<i style="--s:83px;--c:var(--mint);--r:50%;--d:61s;--delay:-35s;--x:12vw;--spin:-360deg;left:59%;--rest:75%"></i>
<i style="--s:50px;--c:var(--amber);--r:50%;--d:39s;--delay:-32s;--x:3vw;--spin:360deg;left:14%;--rest:67%"></i>
<i style="--s:64px;--c:var(--peach);--r:50%;--d:38s;--delay:-5s;--x:5vw;--spin:180deg;left:78%;--rest:60%"></i>
<i style="--s:83px;--c:var(--coral);--r:28%;--d:54s;--delay:-47s;--x:7vw;--spin:360deg;left:81%;--rest:11%"></i>
<i style="--s:93px;--c:var(--violet);--r:14px;--d:36s;--delay:-3s;--x:-11vw;--spin:360deg;left:32%;--rest:13%"></i>
<i style="--s:85px;--c:var(--sky);--r:40% 60% 55% 45%;--d:44s;--delay:-28s;--x:6vw;--spin:360deg;left:68%;--rest:39%"></i>
<i style="--s:63px;--c:var(--mint);--r:50%;--d:49s;--delay:-0s;--x:9vw;--spin:180deg;left:60%;--rest:45%"></i>
<i style="--s:78px;--c:var(--amber);--r:50%;--d:51s;--delay:-5s;--x:10vw;--spin:-180deg;left:42%;--rest:39%"></i>
<i style="--s:91px;--c:var(--peach);--r:50%;--d:43s;--delay:-1s;--x:-10vw;--spin:180deg;left:53%;--rest:23%"></i>
<i style="--s:63px;--c:var(--coral);--r:28%;--d:46s;--delay:-4s;--x:-12vw;--spin:180deg;left:29%;--rest:36%"></i>
<i style="--s:32px;--c:var(--violet);--r:14px;--d:49s;--delay:-24s;--x:10vw;--spin:-360deg;left:55%;--rest:19%"></i>
<i style="--s:51px;--c:var(--sky);--r:40% 60% 55% 45%;--d:58s;--delay:-43s;--x:-4vw;--spin:-180deg;left:13%;--rest:49%"></i>
<i style="--s:68px;--c:var(--mint);--r:50%;--d:34s;--delay:-26s;--x:12vw;--spin:180deg;left:19%;--rest:41%"></i>
<i style="--s:38px;--c:var(--amber);--r:50%;--d:34s;--delay:-3s;--x:2vw;--spin:-360deg;left:24%;--rest:81%"></i>
</div>
<main id="app"></main>
<script src="data.js"></script>
<script src="packs.js"></script>
<script src="topics.js"></script>
<script src="engine.js"></script>
</body>
</html>
